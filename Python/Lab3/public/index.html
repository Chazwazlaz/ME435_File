<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Server</title>
</head>
<body>
    <h1>Serial Server</h1>
    </p>This is the HTML Client. There is also a MATLAB front end</p>

    <div id="replyText">the reply will appear here</div>
<hr>
    <button id="reset">RESET</button>
    <hr>
    <h2>Move the X-Axis</h2>
    <button id="x1">X-AXIS 1</button>
    <button id="x2">X-AXIS 2</button>
    <button id="x3">X-AXIS 3</button>
    <button id="x4">X-AXIS 4</button>
    <button id="x5">X-AXIS 5</button>
    <h2>Move the Z-Axis</h2>
    <button id="z1">EXTEND</button>
    <button id="z2">RETRACT</button>
    <h2>Open or Close the Gripper</h2>
    <button id="g1">OPEN</button>
    <button id="g2">CLOSE</button>
    <h2>Move the Plate</h2>
    <input type="number" id="p1" placeholder="Position 1">
    <input type="number" id="p2" placeholder="Position 2">
    <button id="move">MOVE PLATE</button>

    <script src="main.js"></script>
</body>
</html>
